<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --bg-card-hover: #263449;
            --primary: #38BDF8;
            --accent-green: #4ADE80;
            --accent-gold: #FBBF24;
            --accent-purple: #C084FC;
            --accent-red: #F87171;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 頂部標題 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .header p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
        }
        .today-jump-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--primary);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 同事快速篩選列 */
        .staff-filter-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .staff-filter-bar::-webkit-scrollbar { display: none; }

        .staff-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s;
        }
        .staff-chip.active {
            background: var(--primary);
            color: #0F172A;
            border-color: var(--primary);
            font-weight: 900;
        }

        /* 互動月曆卡 (7列嚴格對齊) */
        .calendar-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 12px 8px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        .cal-legend {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 8px 6px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .legend-items {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .dot-me {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            margin-right: 3px;
        }

        .weekdays-row {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 6px;
        }
        .weekdays-row div:first-child { color: var(--accent-red); }
        .weekdays-row div:last-child { color: var(--primary); }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 5px;
        }
        .day-btn {
            height: 54px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        .day-btn:active { transform: scale(0.93); }

        /* 選中當日高亮 */
        .day-btn.selected {
            background: rgba(56, 189, 248, 0.22) !important;
            border: 2px solid var(--primary) !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }
        /* 按同事篩選時的高亮與淡化 */
        .day-btn.dimmed {
            opacity: 0.22;
        }
        .day-btn.staff-match {
            background: rgba(74, 222, 128, 0.14);
            border-color: rgba(74, 222, 128, 0.45);
        }

        .d-num {
            font-size: 13px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
        }
        .day-btn.today .d-num {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        .d-count {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 6px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .me-indicator {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-green);
        }
        .me-night-indicator {
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 9px;
            line-height: 1;
        }

        /* ================= 當日詳細返工看板 ================= */
        .detail-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .detail-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .nav-day-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-day-btn:active { transform: scale(0.95); }
        .detail-date-title {
            text-align: center;
        }
        .detail-date-title h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
        }
        .detail-date-title span {
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
        }

        /* 營友動態與值夜雙欄資訊卡 */
        .info-boxes {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 10px;
        }
        .info-panel {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-panel.night-panel {
            border-color: rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.08);
        }
        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: bold;
        }
        .info-value {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.35;
        }
        .night-panel .info-value {
            color: var(--accent-gold);
            font-size: 14px;
        }

        /* 返工同事列表 */
        .staff-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
        }
        .staff-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .staff-row {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.15s;
        }
        /* 用戶本人高亮樣式 */
        .staff-row.is-me {
            background: rgba(74, 222, 128, 0.1);
            border-color: rgba(74, 222, 128, 0.45);
        }
        /* 值夜同事邊框提示 */
        .staff-row.is-overnight {
            border-left: 4px solid var(--accent-gold);
        }

        .staff-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .staff-name-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0F172A;
            flex-shrink: 0;
        }
        .staff-name {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-main);
        }
        .badge-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
        }
        .badge-me {
            background: var(--accent-green);
            color: #0F172A;
        }
        .badge-night {
            background: rgba(251, 191, 36, 0.2);
            color: var(--accent-gold);
            border: 1px solid rgba(251, 191, 36, 0.4);
        }
        .badge-shift {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
        }

        .staff-time {
            font-size: 15px;
            font-weight: 900;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        /* 視覺化時間軸 (08:00 - 24:00) */
        .timeline-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .timeline-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .timeline-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 4px;
            background: var(--primary);
        }
        .staff-row.is-me .timeline-bar {
            background: var(--accent-green);
        }
        .staff-row.is-overnight .timeline-bar {
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent-gold) 100%);
        }
        .timeline-scale {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.3);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

            <span>08:00 — 00:00</span>

        <div class="staff-list" id="staffListContainer"></div>

</div>

    let selectedDay = 8; // 預設今日
    let selectedStaffFilter = "全部";

    window.onload = () => {
        const now = new Date();
        if (now.getMonth() === 10) { // 11月 (0-indexed = 10)
            selectedDay = now.getDate();
        } else {
            selectedDay = 1;
        }
        renderStaffFilterBar();
        renderCalendar();
        renderDayDetails();
    };

    function jumpToToday() {
        const now = new Date();
        selectedDay = (now.getMonth() === 10) ? now.getDate() : 8;
        renderCalendar();
        renderDayDetails();
    }

    function stepDay(delta) {
        selectedDay += delta;
        if (selectedDay < 1) selectedDay = 30;
        if (selectedDay > 30) selectedDay = 1;
        renderCalendar();
        renderDayDetails();
    }

    function renderStaffFilterBar() {
        const bar = document.getElementById('staffFilterBar');
        bar.innerHTML = '';
        ALL_STAFF.forEach(name => {
            const chip = document.createElement('button');
            chip.className = `staff-chip ${selectedStaffFilter === name ? 'active' : ''}`;
            // 計算該同事全月返工日數
            if (name === "全部") {
                chip.innerText = "👥 全部同工";
            } else {
                let count = 0;
                for (let d = 1; d <= 30; d++) {
                    if (SCHEDULE_NOV_2026[d].staff.some(s => s.name === name)) count++;
                }
                chip.innerText = `${name === '陳鎵榮' ? '⭐ ' : ''}${name} (${count}日)`;
            }
            chip.onclick = () => {
                selectedStaffFilter = name;
                renderStaffFilterBar();
                renderCalendar();
                renderDayDetails();
            };
            bar.appendChild(chip);
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';

        // 2026年11月1日係星期日 (firstDay = 0)
        const now = new Date();
        const todayNum = (now.getMonth() === 10) ? now.getDate() : -1;

        for (let d = 1; d <= 30; d++) {
            const data = SCHEDULE_NOV_2026[d];
            const btn = document.createElement('button');

            const isSelected = (d === selectedDay);
            const isToday = (d === todayNum);
            const meWorking = data.staff.some(s => s.name === "陳鎵榮");
            const meOvernight = data.overnight.includes("陳鎵榮");

            let filterClass = '';
            if (selectedStaffFilter !== "全部") {
                const match = data.staff.some(s => s.name === selectedStaffFilter);
                filterClass = match ? 'staff-match' : 'dimmed';
            }

            btn.className = `day-btn ${isSelected ? 'selected' : ''} ${isToday ? 'today' : ''} ${filterClass}`;

            let indicatorHtml = '';
            if (meOvernight) {
                indicatorHtml = `<span class="me-night-indicator">🌙</span>`;
            } else if (meWorking) {
                indicatorHtml = `<span class="me-indicator"></span>`;
            }

            btn.innerHTML = `
                ${indicatorHtml}
                <span class="d-num">${d}</span>
                <span class="d-count">${data.staff.length}人</span>
            `;

            btn.onclick = () => {
                selectedDay = d;
                renderCalendar();
                renderDayDetails();
            };

            grid.appendChild(btn);
        }
    }

    // 計算時間軸位置 (以 08:00 為 0%，24:00 為 100%，共 16 小時)
    function calcTimelinePos(timeRange) {
        const [startStr, endStr] = timeRange.split('-');
        const toHour = (str) => {
            const [h, m] = str.split(':').map(Number);
            return h + (m / 60);
        };
        let s = toHour(startStr);
        let e = toHour(endStr);
        if (e === 0) e = 24; // 00:00 視為 24:00

        const leftPct = Math.max(0, ((s - 8) / 16) * 100);
        const widthPct = Math.min(100 - leftPct, ((e - s) / 16) * 100);
        return { leftPct, widthPct, hours: e - s };
    }

    function renderDayDetails() {
        const data = SCHEDULE_NOV_2026[selectedDay];
        document.getElementById('detailDateText').innerText = `11月${selectedDay}日 (星期${data.dow})`;
        document.getElementById('detailCountSubtitle').innerText = `當日共 ${data.staff.length} 位同工返工`;

        document.getElementById('campActivityText').innerText = data.camp;
        document.getElementById('overnightStaffText').innerText =
            data.overnight.length > 0 ? `🌙 ${data.overnight.join('、')}` : '— 無人值夜';

        const listEl = document.getElementById('staffListContainer');
        listEl.innerHTML = '';

        data.staff.forEach(person => {
            const isMe = (person.name === "陳鎵榮");
            const isOvernight = person.stay || data.overnight.includes(person.name);
            const { leftPct, widthPct, hours } = calcTimelinePos(person.time);

            const row = document.createElement('div');
            row.className = `staff-row ${isMe ? 'is-me' : ''} ${isOvernight ? 'is-overnight' : ''}`;

            const color = STAFF_COLORS[person.name] || '#38BDF8';

            let badgesHtml = '';
            if (isMe) {
                badgesHtml += `<span class="badge-tag badge-me">你本人</span>`;
            }
            if (isOvernight) {
                badgesHtml += `<span class="badge-tag badge-night">🌙 值夜留宿</span>`;
            } else {
                badgesHtml += `<span class="badge-tag badge-shift">${hours}小時</span>`;
            }

            row.innerHTML = `
                <div class="staff-row-top">
                    <div class="staff-name-box">
                        <div class="avatar-circle" style="background:${color};">
                            ${person.name.slice(-1)}
                        </div>
                        <span class="staff-name">${person.name}</span>
                        ${badgesHtml}
                    </div>
                    <div class="staff-time">${person.time}</div>
                </div>
                <div class="timeline-wrapper">
                    <div class="timeline-track">
                        <div class="timeline-bar" style="left:${leftPct}%; width:${widthPct}%;"></div>
                    </div>
                    <div class="timeline-scale">
                        <span>08:00</span>
                        <span>12:00</span>
                        <span>16:00</span>
                        <span>20:00</span>
                        <span>00:00</span>
                    </div>
                </div>
            `;
            listEl.appendChild(row);
        });
    }
